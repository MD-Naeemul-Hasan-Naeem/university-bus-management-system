<h3 class="mb-4 fw-bold text-dark">Dashboard Overview</h3>

<div class="row g-4">

  <!-- Card -->
  <div class="col-md-4">
    <div class="card dashboard-card bg-gradient-primary text-white">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h6 class="card-title">Total Users</h6>
          <h2 class="fw-bold">{{ stats?.totalUsers }}</h2>
        </div>
        <div class="icon-circle">
          <i class="bi bi-people-fill"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="col-md-4">
    <div class="card dashboard-card bg-gradient-info text-white">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h6>Total Students</h6>
          <h2 class="fw-bold">{{ stats?.totalStudents }}</h2>
        </div>
        <div class="icon-circle">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="col-md-4">
    <div class="card dashboard-card bg-gradient-secondary text-white">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h6>Total Employees</h6>
          <h2 class="fw-bold">{{ stats?.totalEmployees }}</h2>
        </div>
        <div class="icon-circle">
          <i class="bi bi-person-badge-fill"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="col-md-4">
    <div class="card dashboard-card bg-gradient-success text-white">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h6>Total Buses</h6>
          <h2 class="fw-bold">{{ stats?.totalBuses }}</h2>
        </div>
        <div class="icon-circle">
          <i class="bi bi-bus-front-fill"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="col-md-4">
    <div class="card dashboard-card bg-gradient-warning text-dark">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h6>Total Routes</h6>
          <h2 class="fw-bold">{{ stats?.totalRoutes }}</h2>
        </div>
        <div class="icon-circle bg-dark text-white">
          <i class="bi bi-map-fill"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="col-md-4">
    <div class="card dashboard-card bg-gradient-danger text-white">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h6>Today's Bookings</h6>
          <h2 class="fw-bold">{{ stats?.todayBookings }}</h2>
        </div>
        <div class="icon-circle">
          <i class="bi bi-calendar-check-fill"></i>
        </div>
      </div>
    </div>
  </div>


</div>
