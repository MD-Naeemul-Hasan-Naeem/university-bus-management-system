<div class="container mt-4">

  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4>User Management</h4>
    </div>

    <div class="card-body">

      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Lock</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let u of users">
            <td>{{u.id}}</td>
            <td>{{u.email}}</td>

            <td>
              <select class="form-select form-select-sm"
                      [(ngModel)]="u.role"
                      (change)="changeRole(u.id, u.role)">
                <option>Admin</option>
                <option>User</option>
              </select>
            </td>

            <td>
              <span class="badge bg-success" *ngIf="u.isActive">Active</span>
              <span class="badge bg-danger" *ngIf="!u.isActive">Inactive</span>
            </td>

            <td>
              <button class="btn btn-sm"
                      [class.btn-warning]="u.isLocked"
                      [class.btn-success]="!u.isLocked"
                      (click)="toggleLock(u)">
                {{ u.isLocked ? 'Unlock' : 'Lock' }}
              </button>
            </td>

            <td>
              <button class="btn btn-danger btn-sm"
                      (click)="deleteUser(u.id)">
                Delete
              </button>
            </td>

          </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>
